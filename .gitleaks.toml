# Gitleaks 配置文件
# 默认情况下，Gitleaks 将运行内置的所有检测规则。
# 下面定义了 allowlist，用于排除项目中不需要被扫描的路径。

[extend]
useDefault = true

[allowlist]
description = "Laravel 项目默认忽略的路径，防止扫描第三方依赖和测试文件产生误报"
paths = [
    '''node_modules''',     # 排除前端依赖
    '''vendor''',           # 排除 Composer 后端依赖
    '''composer\.lock''',    # 锁文件可能包含高熵值的 hash，导致误报
    '''bun\.lock''',         # 锁文件可能包含高熵值的 hash，导致误报
    '''package-lock\.json''',
    '''yarn\.lock''',
    '''public/build''',     # 编译后的前端资源
    '''storage''',          # 排除日志和缓存文件
    '''tests''',            # 排除测试代码中的 Mock 数据与假密钥
    '''bootstrap/cache'''   # 排除 Laravel 配置和路由缓存
]
