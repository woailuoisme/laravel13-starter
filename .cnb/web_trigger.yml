# 手动触发按钮 — 分支详情页显示
# 文档: https://docs.cnb.cool/zh/build/web-trigger.html

branch:
  - reg: ".*"
    buttons:
      - name: Docker 构建 (多架构)
        description: 构建 amd64 + arm64 镜像并推送到 latest
        event: web_trigger_multiarch

      - name: Docker 快速构建 (仅 amd64)
        description: 仅构建 linux/amd64 镜像并推送到 latest-amd64
        event: web_trigger_amd64
