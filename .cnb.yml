# CNB 流水线 — Laravel 13 Starter Docker 镜像构建与推送
# 文档: https://docs.cnb.cool/build/quick-start.html
#        https://docs.cnb.cool/zh/build/build-node.html
#
# 内置变量 (CNB 自动注入):
#   CNB_DOCKER_REGISTRY      — 镜像仓库地址，如 docker.cnb.cool
#   CNB_REPO_SLUG_LOWERCASE  — 仓库路径小写，如 my-org/my-repo
#
# 镜像: PHP 8.5 + RoadRunner (Octane)，linux/amd64 + linux/arm64
$:
  # ── 手动触发：多架构构建 (amd64 + arm64) ────────────────────────
  build_multiarch:
    - services:
        - docker
      stages:
        - name: Build and push (multi-arch)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${REGISTRY}:latest" \
              --file ./Dockerfile \
              --cache-from "type=registry,ref=${REGISTRY}:latest-cache" \
              --cache-to "type=registry,ref=${REGISTRY}:latest-cache,mode=max" \
              --push \
              .

  # ── 手动触发：仅 amd64 快速构建 ──────────────────────────────────
  build_amd64:
    - services:
        - docker
      stages:
        - name: Build and push (amd64 only)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            docker buildx build \
              --platform linux/amd64 \
              --tag "${REGISTRY}:latest-amd64" \
              --file ./Dockerfile \
              --cache-from "type=registry,ref=${REGISTRY}:latest-amd64-cache" \
              --cache-to "type=registry,ref=${REGISTRY}:latest-amd64-cache,mode=max" \
              --push \
              .

  # ── v* tag push：构建并推送版本化 tag ──────────────────────────────────
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${REGISTRY}:${VERSION}" \
              --tag "${REGISTRY}:latest" \
              --file ./Dockerfile \
              --cache-from "type=registry,ref=${REGISTRY}:${VERSION}-cache" \
              --cache-to "type=registry,ref=${REGISTRY}:${VERSION}-cache,mode=max" \
              --push \
              .
