glob_matcher: doublestar

pre-commit:
  jobs:
    - name: mago-fmt
      glob: "**/*.php"
      run: mago format {staged_files}
      stage_fixed: true

    - name: mago-lint
      glob: "**/*.php"
      run: mago lint --fix --potentially-unsafe {staged_files}
      stage_fixed: true

    - name: shfmt
      glob: "**/*.sh"
      run: shfmt -w {staged_files}
      stage_fixed: true

    - name: shellcheck
      glob: "**/*.sh"
      run: shellcheck {staged_files}

pre-push:
  jobs:
    - name: pest
      run: php artisan test --compact
