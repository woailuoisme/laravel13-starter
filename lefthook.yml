glob_matcher: doublestar

pre-commit:
  jobs:
    - name: pint
      glob: "**/*.php"
      run: vendor/bin/pint --parallel --silent --format agent {staged_files}
      stage_fixed: true

    - name: hadolint
      glob: "**/Dockerfile"
      run: hadolint {staged_files}

    - name: actionlint
      glob: ".github/workflows/**/*.yml"
      run: actionlint {staged_files}

    - name: shfmt
      glob: "**/*.sh"
      run: shfmt -w {staged_files}
      stage_fixed: true

    - name: shellcheck
      glob: "**/*.sh"
      run: shellcheck {staged_files}

