services:
  app:
    container_name: rr-app
    image: ${DOCKER_IMAGE:-laravel-roadrunner:latest}
    build:
      context: ../..
      dockerfile: docker/roadrunner/Dockerfile
    env_file:
      - ../../.env.production
    environment:
      APP_PATH: /app
      APP_DEBUG: "false"
      OCTANE_HOST: 0.0.0.0
      OCTANE_WORKERS: ${OCTANE_WORKERS:-4}
      OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-1000}
      WATCH: "false"
    command: ["/usr/local/bin/startup-octane.sh"]
    ports:
      - "${APP_PUBLISHED_PORT:-8001}:${APP_PORT:-8001}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "octane"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    volumes:
      - app-storage:/app/storage
#    depends_on:
#      - valkey
#      - postgres
#      - centrifugo
#      - garage
#      - meilisearch
#      - mailpit
#      - mosquitto
    networks:
      - backend

  horizon:
    container_name: rr-horizon
    image: ${DOCKER_IMAGE:-laravel-roadrunner:latest}
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ../../.env.production
    environment:
      APP_PATH: /app
      APP_DEBUG: "false"
    command: ["/usr/local/bin/startup-horizon.sh"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "horizon"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    volumes:
      - app-storage:/app/storage
    networks:
      - backend

  schedule:
    container_name: rr-schedule
    image: ${DOCKER_IMAGE:-laravel-roadrunner:latest}
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ../../.env.production
    environment:
      APP_PATH: /app
      APP_DEBUG: "false"
    command: ["/usr/local/bin/startup-schedule.sh"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "schedule"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
    volumes:
      - app-storage:/app/storage
    networks:
      - backend

volumes:
  app-storage:

networks:
  backend:
    name: ${DOCKER_NETWORK:-backend}
    external: true
