; ============================================================================
; Laravel Octane/RoadRunner 生产环境 PHP 配置
; ============================================================================

; 设置默认时区
date.timezone = Asia/Shanghai

; 设置默认字符集
default_charset = "UTF-8"

; 设置 PHP 变量注册顺序（EGPCS: Environment, Get, Post, Cookie, Server）
; 必须包含 'E' 才能在 $_ENV 中读取环境变量
variables_order = "EGPCS"

; ============================================================================
; 错误处理（生产环境）
; ============================================================================

; 关闭错误显示（安全）
display_errors = Off
display_startup_errors = Off

; 开启错误日志记录
log_errors = On

; 错误日志输出到标准错误流（Docker 日志收集）
error_log = /proc/self/fd/2

; 错误报告级别（生产环境：只记录错误和警告）
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ============================================================================
; 内存和执行时间配置（RoadRunner 优化）
; ============================================================================

; PHP 内存限制
memory_limit = 384M

; 上传文件大小限制
upload_max_filesize = 50M

; POST 数据大小限制
post_max_size = 20M

; 最大执行时间（秒）
max_execution_time = 600

; 默认 Socket 超时时间（秒）
default_socket_timeout = 3600

; ============================================================================
; OPcache 字节码缓存配置 - 生产环境优化 (RoadRunner/Laravel)
; ============================================================================

; 启用 OPcache
opcache.enable = 1

; 启用 CLI 模式的 OPcache（RoadRunner/Octane 必须启用）
opcache.enable_cli = 1

; JIT (Just-In-Time) 编译器配置
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; 内存与文件数量配置
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 40000
opcache.max_file_size = 0

; 生产环境不验证脚本时间戳，发布后需要重启 RoadRunner。
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; 优化与特性
opcache.enable_file_override = 1
opcache.fast_shutdown = 1
opcache.file_cache_consistency_checks = 1
opcache.record_warnings = 0

; Laravel 需要保留注释以兼容依赖注入和部分包能力。
opcache.save_comments = 1
opcache.load_comments = 1

; 其他
opcache.use_cwd = 1
opcache.max_wasted_percentage = 10

; ============================================================================
; PostgreSQL 数据库扩展配置
; ============================================================================

[PostgreSQL]

; 常驻内存环境建议关闭驱动级持久连接。
pgsql.allow_persistent = Off

; 长连接环境开启此项可自动重连。
pgsql.auto_reset_persistent = On

; 生产环境建议忽略 Notice 消息。
pgsql.ignore_notice = 1

; ============================================================================
; Redis (PhpRedis) 扩展配置
; ============================================================================

[redis]

; 连接池与持久连接优化
redis.pconnect.pooling_enabled = On
redis.pconnect.connection_limit = -1
redis.pconnect.echo_check_liveness = On

; Session 锁配置（仅当使用 Redis Session 时按需开启）
; redis.session.locking_enabled = On
; redis.session.lock_expire = 20
; redis.session.lock_retries = 10
; redis.session.lock_wait = 20000

; 集群读超时时间（毫秒，按需开启）
; redis.clusters.read_timeout = 2000

; ============================================================================
; MySQL (MySQLi/PDO_MySQL) 扩展配置
; ============================================================================

[mysqli]

; 长连接/常驻内存环境下禁用驱动级持久连接。
mysqli.allow_persistent = Off

[mysqlnd]

; 生产环境禁用统计信息收集以减少开销。
mysqlnd.collect_statistics = Off

; ============================================================================
; AMQP (RabbitMQ) 扩展配置
; ============================================================================

[amqp]

; 显式设置超时以防止网络僵死。
amqp.connect_timeout = 10
amqp.read_timeout = 30
amqp.write_timeout = 30

; 心跳对维持长连接活性至关重要。
amqp.heartbeat = 60
